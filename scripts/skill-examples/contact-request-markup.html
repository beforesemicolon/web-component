<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Reusable contact request</title>
    </head>
    <body>
        <button type="button" id="alternate-copy">
            Apply Portuguese form copy
        </button>
        <contact-request>
            <p slot="help">We will use your email to reply.</p>
        </contact-request>
        <p id="contact-feedback" role="status"></p>
    </body>
</html>
